<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Basketball Visual Playtest</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070b12;color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1500px;margin:auto;padding:12px}.head{border:1px solid #283548;background:#101722;border-radius:18px;padding:12px;margin-bottom:10px}.headTop{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.head h1{font-size:18px;margin:0}.head p{font-size:12px;color:#aeb9c8;margin:5px 0 0}.gallery{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 2px}.gallery figure{flex:0 0 78px;margin:0}.gallery img{width:78px;height:117px;object-fit:cover;border-radius:9px;border:1px solid #34445c;display:block;box-shadow:0 6px 18px rgba(0,0,0,.28)}.gallery figcaption{font-size:9px;font-weight:800;text-align:center;margin-top:4px;color:#d8e1ee}.gameFrame{width:100%;height:1500px;border:0;border-radius:20px;background:#090d14;display:block}@media(max-width:700px){.wrap{padding:6px}.head{padding:9px}.gallery figure{flex-basis:62px}.gallery img{width:62px;height:93px}.gameFrame{height:1900px;border-radius:14px}}
</style>
</head>
<body>
<div class="wrap">
  <section class="head">
    <div class="headTop"><div><h1>🏀 Goal-Scoring Moment · 图片试玩版</h1><p>游戏逻辑仍然使用当前正式试玩页；这里把 8 种功能牌的 WebP 卡图直接注入手牌和操作按钮，方便你测试实际视觉效果。</p></div></div>
    <div class="gallery">
      <figure><img src="images/two-point-shot.webp"><figcaption>2-POINT</figcaption></figure>
      <figure><img src="images/three-pointer.webp"><figcaption>3-POINTER</figcaption></figure>
      <figure><img src="images/free-throw.webp"><figcaption>FREE THROW</figcaption></figure>
      <figure><img src="images/block.webp"><figcaption>BLOCK</figcaption></figure>
      <figure><img src="images/contest.webp"><figcaption>CONTEST</figcaption></figure>
      <figure><img src="images/steal.webp"><figcaption>STEAL</figcaption></figure>
      <figure><img src="images/foul.webp"><figcaption>FOUL</figcaption></figure>
      <figure><img src="images/pump-fake.webp"><figcaption>PUMP FAKE</figcaption></figure>
    </div>
  </section>
  <iframe id="game" class="gameFrame" src="./?visual=1" title="Basketball game visual playtest"></iframe>
</div>
<script>
const CARD_ART=[
  ['2-POINT SHOT','images/two-point-shot.webp'],['3-POINTER','images/three-pointer.webp'],['FREE THROW','images/free-throw.webp'],['BLOCK','images/block.webp'],['CONTEST','images/contest.webp'],['STEAL','images/steal.webp'],['FOUL','images/foul.webp'],['PUMP FAKE','images/pump-fake.webp']
];
const frame=document.getElementById('game');
function matchArt(text){return CARD_ART.find(([name])=>text.includes(name));}
function install(doc){
  if(!doc||!doc.body)return;
  if(!doc.getElementById('gsmVisualCardStyle')){
    const style=doc.createElement('style');style.id='gsmVisualCardStyle';style.textContent=`
      .chips{gap:8px!important;align-items:flex-start!important}.artChip{position:relative!important;width:66px!important;height:99px!important;padding:0!important;overflow:hidden!important;border-radius:8px!important;background:#090d14!important;border:1px solid rgba(255,255,255,.28)!important;box-shadow:0 5px 13px rgba(0,0,0,.3)!important}.artChip img{display:block;width:100%;height:100%;object-fit:cover}.artChip .artCount{position:absolute;right:3px;bottom:3px;font-size:11px!important;line-height:1!important;background:rgba(0,0,0,.82);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:4px 5px;font-weight:950}.role{min-height:205px!important}.artBtn{display:inline-flex!important;align-items:center!important;gap:7px!important}.artBtn img{width:27px;height:40px;object-fit:cover;border-radius:4px;border:1px solid rgba(255,255,255,.3);pointer-events:none}@media(max-width:620px){.artChip{width:54px!important;height:81px!important}.role{min-height:185px!important}.artBtn img{width:22px;height:33px}}
    `;doc.head.appendChild(style);
  }
  const decorate=()=>{
    doc.querySelectorAll('.chip:not([data-visual-art])').forEach(el=>{
      const text=el.textContent.trim(),m=matchArt(text);if(!m)return;
      const count=(text.match(/×\s*(\d+)/)||[])[1]||'1';
      el.dataset.visualArt='1';el.classList.add('artChip');el.title=text;
      el.innerHTML=`<img src="${m[1]}" alt="${m[0]}"><span class="artCount">×${count}</span>`;
    });
    doc.querySelectorAll('.btn:not([data-visual-art])').forEach(btn=>{
      const text=btn.textContent.trim(),m=matchArt(text);if(!m)return;
      btn.dataset.visualArt='1';btn.classList.add('artBtn');
      const img=doc.createElement('img');img.src=m[1];img.alt='';btn.prepend(img);
    });
  };
  decorate();
  const obs=new MutationObserver(()=>requestAnimationFrame(decorate));obs.observe(doc.body,{childList:true,subtree:true});
}
frame.addEventListener('load',()=>{try{install(frame.contentDocument);}catch(e){console.error(e);}});
</script>
</body>
</html>
